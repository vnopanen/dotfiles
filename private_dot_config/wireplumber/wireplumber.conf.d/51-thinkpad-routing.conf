monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*.HiFi__Headphones__sink" } ]
    actions = { update-props = { priority.driver = 2000, priority.session = 2000 } }
  },
  {
    matches = [ { node.name = "~alsa_input.*.HiFi__Mic2__source" } ]
    actions = { update-props = { priority.driver = 2000, priority.session = 2000 } }
  },
  {
    matches = [ { node.name = "~alsa_output.*.HiFi__Speaker__sink" } ]
    actions = { update-props = { priority.driver = 1000, priority.session = 1000 } }
  },
  {
    matches = [ { node.name = "~alsa_input.*.HiFi__Mic1__source" } ]
    actions = { update-props = { priority.driver = 1000, priority.session = 1000 } }
  },
  {
    matches = [ { node.name = "~alsa_output.*.HiFi__HDMI.*" } ]
    actions = { update-props = { priority.driver = 500, priority.session = 500 } }
  }
]
